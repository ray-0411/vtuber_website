<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>排行榜 · Live Observatory</title>
  <base id="site-base" href="/">
  <script>if(location.hostname.endsWith(".github.io"))document.getElementById("site-base").href="/vtuber_website/";</script>
  <script src="site.js?v=2"></script>
  <link rel="stylesheet" href="analytics.css?v=4">
  <link rel="stylesheet" href="navigation.css?v=5">
  <link rel="stylesheet" href="dashboard-theme.css?v=5">
  <link rel="stylesheet" href="rankings.css?v=9">
</head>
<body class="rankings-page">
  <header class="topbar">
    <div class="nav-left">
      <button class="menu-button" type="button" aria-label="開啟導覽選單" aria-expanded="false"><span></span></button>
      <a class="brand" href="./"><span class="brand-mark">V</span><span>Live Observatory</span></a>
    </div>
    <nav><a href="./">總覽</a><a class="active" href="rankings">排行榜</a></nav>
  </header>
  <div class="drawer-overlay"></div>
  <aside class="nav-drawer" aria-label="網站導覽">
    <div class="drawer-head"><strong>Explore</strong><button class="drawer-close" type="button" aria-label="關閉選單">×</button></div>
    <a class="drawer-home" href="./"><span>直播總覽</span><span>⌂</span></a>
    <div class="drawer-section-title">GROUP ANALYTICS</div>
    <div class="drawer-groups"><div class="drawer-loading">載入 Group 中…</div></div>
    <div class="drawer-foot">LIVE OBSERVATORY</div>
  </aside>
  <main class="rankings-main">
    <div class="crumbs"><a href="./">首頁</a><span>/</span><span>排行榜</span></div>
    <section class="ranking-controls" aria-label="排行榜篩選">
      <label>排序項目<select id="ranking-metric"><option value="average_viewers">平均觀眾數</option><option value="viewer_hours">觀眾小時</option></select></label>
      <label>平台<select id="ranking-platform"><option value="combined">綜合</option><option value="youtube">YouTube</option><option value="twitch">Twitch</option></select></label>
      <label>時間<select id="ranking-period"><option value="1m">近 1 個月</option><option value="3m">近 3 個月</option><option value="6m">近 6 個月</option><option value="1y">近 1 年</option><option value="all">全部</option></select></label>
    </section>
    <section class="ranking-panel">
      <div class="ranking-heading"><div><p class="eyebrow">ALL MEMBERS</p><h2 id="ranking-title">平均觀眾數排行榜</h2></div><span id="ranking-count">讀取中…</span></div>
      <div class="ranking-table-wrap">
        <table class="member-ranking-table" id="member-ranking-table">
          <thead><tr><th>#</th><th>成員</th><th>Group</th><th id="primary-value-heading">綜合</th><th class="platform-detail">YT</th><th class="platform-detail">TW</th></tr></thead>
          <tbody id="ranking-list"><tr><td colspan="6" class="ranking-empty">正在載入排行榜…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer><a href="./">← 回到直播總覽</a><span>Live Observatory · Rankings</span></footer>
  <script src="supabase-config.js?v=1"></script>
  <script src="build-version.js?v=1"></script>
  <script src="api-client.js?v=4"></script>
  <script src="navigation.js?v=5"></script>
  <script src="rankings.js?v=5"></script>
</body>
</html>
